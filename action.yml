name: AI社員
description: GitHub Issue を読んで仕事をし、チェック担当が確かめてから Pull Request を作成する
inputs:
  anthropic_api_key:
    description: Anthropic API キー
    required: true
  github_token:
    description: ブランチの push と PR・コメント作成に使うトークン
    required: true
  model:
    description: 使用する Claude のモデル
    default: claude-opus-5-5
  max_turns:
    description: 担当（仕事をする側）の最大ターン数
    default: "60"
  max_budget_usd:
    description: 担当の 1 回の作業で使う上限金額 (USD)
    default: "5"
  manual:
    description: 対象リポジトリにある AI社員の業務マニュアルのパス（なければ .github/ai-shain.md → AI_SHAIN.md → docs/ai-shain.md の順に探す）
    default: .github/ai-shain.md
  allow_web:
    description: Web の検索・取得を許可するか（true で、事実や出典の確認に使える）
    default: "false"
  review:
    description: 担当のあとにチェック担当を動かすか（差分を読んで直し、PR 本文を仕上げる）
    default: "true"
  review_max_turns:
    description: チェック担当の最大ターン数
    default: "40"
  review_budget_usd:
    description: チェック担当の上限金額 (USD)
    default: "3"
  job_title:
    description: Issue のないイベント（schedule・workflow_dispatch）で使う、仕事の題
    default: ""
  job_body:
    description: 同じく、仕事の本文（Issue の本文に相当）
    default: ""
  job_labels:
    description: 同じく、仕事の種類のラベル（例 ai-task:x）
    default: ""
  report_issue:
    description: 定期の仕事の結果（PR のリンクか、変更なしの報告）をコメントする Issue の番号
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: 依存パッケージのインストール
      shell: bash
      run: npm ci --prefix "$GITHUB_ACTION_PATH" --no-audit --no-fund

    - name: 作業ブランチの作成
      shell: bash
      env:
        ISSUE_NUMBER: ${{ github.event.issue.number }}
      run: |
        git config user.name "ai-shain[bot]"
        git config user.email "ai-shain@users.noreply.github.com"
        git checkout -b "ai-shain/${ISSUE_NUMBER:+issue-$ISSUE_NUMBER-}${ISSUE_NUMBER:-job-}${GITHUB_RUN_ID}"

    - name: AI社員が作業（担当 → チェック担当）
      shell: bash
      # GitHub トークンはエージェントに渡さない
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        MODEL: ${{ inputs.model }}
        MAX_TURNS: ${{ inputs.max_turns }}
        MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
        MANUAL: ${{ inputs.manual }}
        ALLOW_WEB: ${{ inputs.allow_web }}
        REVIEW: ${{ inputs.review }}
        REVIEW_MAX_TURNS: ${{ inputs.review_max_turns }}
        REVIEW_BUDGET_USD: ${{ inputs.review_budget_usd }}
        JOB_TITLE: ${{ inputs.job_title }}
        JOB_BODY: ${{ inputs.job_body }}
        JOB_LABELS: ${{ inputs.job_labels }}
        TARGET_DIR: ${{ github.workspace }}
        SUMMARY_FILE: ${{ runner.temp }}/ai-shain-summary.md
      run: npx --prefix "$GITHUB_ACTION_PATH" tsx "$GITHUB_ACTION_PATH/src/index.ts"

    - name: コミットして PR を作成
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        ISSUE_TITLE: ${{ github.event.issue.title || inputs.job_title }}
        REPORT_ISSUE: ${{ inputs.report_issue }}
        SUMMARY_FILE: ${{ runner.temp }}/ai-shain-summary.md
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        [ -f "$SUMMARY_FILE" ] || echo "AI社員の作業が開始前に失敗しました。実行ログを確認してください（ANTHROPIC_API_KEY が未登録の可能性があります）。" > "$SUMMARY_FILE"
        # Issue から起動したときは Closes #N。定期の仕事では、報告先の Issue（report_issue）にコメントする
        comment_to="${ISSUE_NUMBER:-$REPORT_ISSUE}"
        if [ -n "$ISSUE_NUMBER" ]; then printf '\n---\nCloses #%s\n\n[実行ログ](%s)\n' "$ISSUE_NUMBER" "$RUN_URL" >> "$SUMMARY_FILE"; else printf '\n---\n[実行ログ](%s)\n' "$RUN_URL" >> "$SUMMARY_FILE"; fi

        git add -A
        if git diff --cached --quiet; then
          [ -n "$comment_to" ] && gh issue comment "$comment_to" --body-file "$SUMMARY_FILE"
          exit 0
        fi

        git commit -q -m "AI社員: ${ISSUE_TITLE}${ISSUE_NUMBER:+ (#$ISSUE_NUMBER)}"
        branch="$(git branch --show-current)"
        git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${branch}"
        pr_url="$(gh pr create --draft --head "$branch" --title "AI社員: ${ISSUE_TITLE}" --body-file "$SUMMARY_FILE")"
        [ -n "$comment_to" ] && gh issue comment "$comment_to" --body "PR を作成しました: ${pr_url}"
