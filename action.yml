name: AI社員
description: GitHub Issue を読んでコードを修正し、Pull Request を作成する
inputs:
  anthropic_api_key:
    description: Anthropic API キー
    required: true
  github_token:
    description: ブランチの push と PR・コメント作成に使うトークン
    required: true
  model:
    description: 使用する Claude のモデル
    default: claude-opus-5-5
  max_turns:
    description: エージェントの最大ターン数
    default: "60"
  max_budget_usd:
    description: 1 回の作業で使う上限金額 (USD)
    default: "5"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: 依存パッケージのインストール
      shell: bash
      run: npm ci --prefix "$GITHUB_ACTION_PATH" --no-audit --no-fund

    - name: 作業ブランチの作成
      shell: bash
      env:
        ISSUE_NUMBER: ${{ github.event.issue.number }}
      run: |
        git config user.name "ai-shain[bot]"
        git config user.email "ai-shain@users.noreply.github.com"
        git checkout -b "ai-shain/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"

    - name: AI社員が作業
      shell: bash
      # GitHub トークンはエージェントに渡さない
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        MODEL: ${{ inputs.model }}
        MAX_TURNS: ${{ inputs.max_turns }}
        MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
        TARGET_DIR: ${{ github.workspace }}
        SUMMARY_FILE: ${{ runner.temp }}/ai-shain-summary.md
      run: npx --prefix "$GITHUB_ACTION_PATH" tsx "$GITHUB_ACTION_PATH/src/index.ts"

    - name: コミットして PR を作成
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
        SUMMARY_FILE: ${{ runner.temp }}/ai-shain-summary.md
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        [ -f "$SUMMARY_FILE" ] || echo "AI社員の作業が開始前に失敗しました。" > "$SUMMARY_FILE"
        printf '\n---\nCloses #%s\n\n[実行ログ](%s)\n' "$ISSUE_NUMBER" "$RUN_URL" >> "$SUMMARY_FILE"

        git add -A
        if git diff --cached --quiet; then
          gh issue comment "$ISSUE_NUMBER" --body-file "$SUMMARY_FILE"
          exit 0
        fi

        git commit -q -m "AI社員: ${ISSUE_TITLE} (#${ISSUE_NUMBER})"
        branch="$(git branch --show-current)"
        git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${branch}"
        pr_url="$(gh pr create --draft --head "$branch" --title "AI社員: ${ISSUE_TITLE}" --body-file "$SUMMARY_FILE")"
        gh issue comment "$ISSUE_NUMBER" --body "PR を作成しました: ${pr_url}"
